<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef;
            border-radius: 5px;
            color: #333;
        }
        .label {
            font-size: 0.9rem;
            color: #666;
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }
        .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cálculo do IRRF</h2>
    
    <label class="label">Salário Bruto:</label>
    <input type="number" id="salarioInput" placeholder="Digite o salário_base" step="0.01">

    <button onclick="calcularIR()">Calcular Imposto</button>

    <div class="result-box" id="resultadoArea" style="display: none;">
        <span class="label">Valor a Recolher:</span>
        <span class="value" id="irResult"></span>
    </div>
</div>

<script>
    function calcularIR() {
        // 1. Pega o valor inserido no campo de input
        const inputValor = document.getElementById('salarioInput').value;
        const salarioBase = parseFloat(inputValor);

        // Validação simples
        if (isNaN(salarioBase)) {
            alert("Por favor,digite um número válido.");
            return;
        }

        // 2. Sua lógica original (Transcrita exatamente)
        let ir = 0;

        if (salarioBase < 5000){
            ir = 0; 
        } else if (salarioBase >= 5000 && salarioBase <= 7350){
            let reducao = 978.62 - (0.13314 * salarioBase);
            ir = salarioBase * 0.275 - 908.73 - reducao;
        } else {
            ir = salarioBase * 0.275 - 908.73;  
        }

        // 3. Formata o resultado para Real (BRL)
        const formatter = new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL',
        });

        // 4. Exibe na tela
        const resultDiv = document.getElementById('resultadoArea');
        const resultSpan = document.getElementById('irResult');

        // Se o IR for negativo (erro na lógica ou salário baixo), tratan como 0
        if (ir < 0) ir = 0;

        resultSpan.innerText = formatter.format(ir);
        resultDiv.style.display = 'block';
    }
</script>

</body>
</html>
